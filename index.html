<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo List Ku</title>
<style>
body{font-family:Arial; background:#e8f5e9; display:flex; justify-content:center; padding:20px}
.box{background:white; padding:20px; border-radius:15px; width:95%; max-width:400px; box-shadow:0 5px 20px rgba(0,0,0,.1)}
h1{text-align:center}
input{width:68%; padding:12px; border:2px solid #222; border-radius:8px}
button{padding:12px; border:none; border-radius:8px; font-weight:bold; cursor:pointer}
.tambah{background:#2e7d32; color:white}
.tugas{display:flex; justify-content:space-between; background:#f1f1f1; padding:10px; margin-top:10px; border-radius:8px}
.selesai{text-decoration:line-through; color:gray}
.hapus{background:#d32f2f; color:white; padding:5px 10px}
</style>
</head>
<body>
<div class="box">
<h1>Todo List Ku ✅</h1>
<div style="display:flex; gap:6px">
<input id="tulis" placeholder="Tulis tugas...">
<button class="tambah" onclick="tambah()">Tambah</button>
</div>
<div id="daftar"></div>
</div>
<script>
let data = JSON.parse(localStorage.getItem('todoku')||'[]');
tampil();
function tambah(){
  let v=document.getElementById('tulis').value.trim();
  if(!v) return;
  data.push({teks:v, selesai:false});
  document.getElementById('tulis').value='';
  simpan();
}
function simpan(){
  localStorage.setItem('todoku', JSON.stringify(data));
  tampil();
}
function tampil(){
  let d=document.getElementById('daftar'); d.innerHTML='';
  data.forEach((x,i)=>{
    d.innerHTML+=`<div class="tugas"><span onclick="toggle(${i})" class="${x.selesai?'selesai':''}" style="flex:1">${x.teks}</span><button class="hapus" onclick="hapus(${i})">X</button></div>`;
  });
}
function hapus(i){ data.splice(i,1); simpan(); }
function toggle(i){ data[i].selesai=!data[i].selesai; simpan(); }
</script>
</body>
</html>
