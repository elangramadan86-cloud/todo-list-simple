<!DOCTYPE html>
<html>
<head>
<title>Todo List</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;padding:20px;background:#f0f0f0}.box{max-width:400px;margin:auto;background:white;padding:20px;border-radius:15px}h1{text-align:center}input{width:60%;padding:12px}button{padding:12px;background:green;color:white;border:none;border-radius:8px}ul{list-style:none;padding:0}li{padding:10px;background:#eee;margin:5px 0;border-radius:5px;display:flex;justify-content:space-between}</style>
</head>
<body>
<div class="box">
<h1>Todo List Ku</h1>
<input id="tulis" placeholder="Tulis tugas...">
<button onclick="tambah()">Tambah</button>
<ul id="daftar"></ul>
</div>
<script>
function tambah(){
let v=document.getElementById('tulis').value;
if(v=="")return;
let li=document.createElement('li');
li.innerHTML=v+' <span onclick="this.parentElement.remove()" style="color:red">X</span>';
document.getElementById('daftar').appendChild(li);
document.getElementById('tulis').value="";
}
</script>
</body>
</html>
